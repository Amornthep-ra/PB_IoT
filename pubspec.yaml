name: pb_iot
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^19.4.2
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/logo/Princebot_IoT_V2.png
    - assets/icons/logo/Princebot_IoT_V2C.png
    - assets/icons/logo/Princebot_IoT_Login.png
    - assets/icons/logo/Princebot_IoT_splash.png
    - assets/icons/dashboard_builder/
    - assets/icons/mascot/
    - assets/icons/profile/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo/Princebot_IoT_V2.png"
  adaptive_icon_background: "#10162B"
  adaptive_icon_foreground: "assets/icons/logo/Princebot_IoT_V2.png"
